<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CEOGAME - Game Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0a0a1a;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px; height: 300px;
            background: rgba(0, 255, 136, 0.08);
            top: -100px; left: -50px;
            animation-delay: 0s !important;
        }

        .orb-2 {
            width: 250px; height: 250px;
            background: rgba(120, 50, 255, 0.08);
            top: 30%; right: -80px;
            animation-delay: -3s !important;
        }

        .orb-3 {
            width: 350px; height: 350px;
            background: rgba(255, 50, 100, 0.06);
            bottom: -100px; left: 30%;
            animation-delay: -5s !important;
        }

        .orb-4 {
            width: 200px; height: 200px;
            background: rgba(0, 180, 255, 0.07);
            top: 50%; left: -60px;
            animation-delay: -2s !important;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }

        /* Grid çizgileri */
        .grid-lines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 10;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER / LOGO ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .ceogame-logo {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 8px;
        }

        .ceogame-logo .letter {
            display: inline-block;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            animation: letterGlow 3s ease-in-out infinite;
        }

        .letter:nth-child(1) { color: #00ff88; animation-delay: 0s; }
        .letter:nth-child(2) { color: #00ddff; animation-delay: 0.1s; }
        .letter:nth-child(3) { color: #7832ff; animation-delay: 0.2s; }
        .letter:nth-child(4) { color: #ff3264; animation-delay: 0.3s; }
        .letter:nth-child(5) { color: #ffaa00; animation-delay: 0.4s; }
        .letter:nth-child(6) { color: #00ff88; animation-delay: 0.5s; }
        .letter:nth-child(7) { color: #ff3264; animation-delay: 0.6s; }

        @keyframes letterGlow {
            0%, 100% { text-shadow: 0 0 10px currentColor; transform: translateY(0); }
            50% { text-shadow: 0 0 25px currentColor, 0 0 50px currentColor; transform: translateY(-3px); }
        }

        .header-subtitle {
            color: rgba(255,255,255,0.25);
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .header-line {
            width: 80px;
            height: 2px;
            margin: 12px auto 0;
            border-radius: 10px;
            background: linear-gradient(90deg, #00ff88, #7832ff, #ff3264);
        }

        /* ===== GAME GRID ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            flex: 1;
        }

        .game-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.12;
            transition: opacity 0.3s;
        }

        .game-card:hover::before {
            opacity: 0.2;
        }

        .game-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(255,255,255,0.15);
        }

        .game-card:active {
            transform: scale(0.96);
        }

        /* Oyun kartı renkleri */
        .game-card.g1::before { background: linear-gradient(135deg, #00ff88, #00cc6a); }
        .game-card.g1 { box-shadow: 0 8px 30px rgba(0,255,136,0.08); }
        .game-card.g1:hover { box-shadow: 0 12px 40px rgba(0,255,136,0.15); }
        .game-card.g1 .game-icon { color: #00ff88; }

        .game-card.g2::before { background: linear-gradient(135deg, #7832ff, #5a1edd); }
        .game-card.g2 { box-shadow: 0 8px 30px rgba(120,50,255,0.08); }
        .game-card.g2:hover { box-shadow: 0 12px 40px rgba(120,50,255,0.15); }
        .game-card.g2 .game-icon { color: #7832ff; }

        .game-card.g3::before { background: linear-gradient(135deg, #ff3264, #cc1944); }
        .game-card.g3 { box-shadow: 0 8px 30px rgba(255,50,100,0.08); }
        .game-card.g3:hover { box-shadow: 0 12px 40px rgba(255,50,100,0.15); }
        .game-card.g3 .game-icon { color: #ff3264; }

        .game-card.g4::before { background: linear-gradient(135deg, #00ddff, #00aacc); }
        .game-card.g4 { box-shadow: 0 8px 30px rgba(0,221,255,0.08); }
        .game-card.g4:hover { box-shadow: 0 12px 40px rgba(0,221,255,0.15); }
        .game-card.g4 .game-icon { color: #00ddff; }

        .game-card.g5::before { background: linear-gradient(135deg, #ffaa00, #cc8800); }
        .game-card.g5 { box-shadow: 0 8px 30px rgba(255,170,0,0.08); }
        .game-card.g5:hover { box-shadow: 0 12px 40px rgba(255,170,0,0.15); }
        .game-card.g5 .game-icon { color: #ffaa00; }

        .game-card.g6::before { background: linear-gradient(135deg, #ff6b35, #cc4a1a); }
        .game-card.g6 { box-shadow: 0 8px 30px rgba(255,107,53,0.08); }
        .game-card.g6:hover { box-shadow: 0 12px 40px rgba(255,107,53,0.15); }
        .game-card.g6 .game-icon { color: #ff6b35; }

        .game-card.g7::before { background: linear-gradient(135deg, #e040fb, #aa00cc); }
        .game-card.g7 { box-shadow: 0 8px 30px rgba(224,64,251,0.08); }
        .game-card.g7:hover { box-shadow: 0 12px 40px rgba(224,64,251,0.15); }
        .game-card.g7 .game-icon { color: #e040fb; }

        .game-card.g8::before { background: linear-gradient(135deg, #18ffff, #00cccc); }
        .game-card.g8 { box-shadow: 0 8px 30px rgba(24,255,255,0.08); }
        .game-card.g8:hover { box-shadow: 0 12px 40px rgba(24,255,255,0.15); }
        .game-card.g8 .game-icon { color: #18ffff; }

        .game-card.g9::before { background: linear-gradient(135deg, #76ff03, #55cc00); }
        .game-card.g9 { box-shadow: 0 8px 30px rgba(118,255,3,0.08); }
        .game-card.g9:hover { box-shadow: 0 12px 40px rgba(118,255,3,0.15); }
        .game-card.g9 .game-icon { color: #76ff03; }

        /* Kart içerik */
        .game-icon {
            font-size: 32px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
            transition: transform 0.3s;
        }

        .game-card:hover .game-icon {
            transform: scale(1.15);
        }

        .game-name {
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            position: relative;
            z-index: 2;
            line-height: 1.3;
        }

        .game-number {
            position: absolute;
            top: 8px;
            right: 10px;
            color: rgba(255,255,255,0.08);
            font-size: 28px;
            font-weight: 900;
            z-index: 1;
        }

        /* Yakında gelecek oyunlar */
        .game-card.coming-soon {
            opacity: 0.4;
            cursor: default;
        }

        .game-card.coming-soon:hover {
            transform: none;
        }

        .game-card.coming-soon:active {
            transform: none;
        }

        .coming-badge {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
            font-size: 7px;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            z-index: 2;
            white-space: nowrap;
        }

        /* ===== HOME BUTTON ===== */
        .home-section {
            margin-top: 20px;
            text-align: center;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .home-btn i {
            font-size: 16px;
        }

        /* ===== FOOTER ===== */
        .game-footer {
            text-align: center;
            margin-top: 20px;
            padding-bottom: 10px;
        }

        .made-by {
            color: rgba(255,255,255,0.1);
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .made-by span {
            background: linear-gradient(90deg, #00ff88, #7832ff, #ff3264);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .container { padding: 20px 14px 15px; }
            .game-grid { gap: 10px; }
            .ceogame-logo .letter { font-size: 30px; }
            .game-icon { font-size: 26px; }
            .game-name { font-size: 10px; }
        }

        /* ===== LOADING ANIMATION ===== */
        .container {
            animation: containerFadeIn 0.8s ease-out;
        }

        @keyframes containerFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-card {
            animation: cardPop 0.5s ease-out backwards;
        }

        .game-card:nth-child(1) { animation-delay: 0.1s; }
        .game-card:nth-child(2) { animation-delay: 0.15s; }
        .game-card:nth-child(3) { animation-delay: 0.2s; }
        .game-card:nth-child(4) { animation-delay: 0.25s; }
        .game-card:nth-child(5) { animation-delay: 0.3s; }
        .game-card:nth-child(6) { animation-delay: 0.35s; }
        .game-card:nth-child(7) { animation-delay: 0.4s; }
        .game-card:nth-child(8) { animation-delay: 0.45s; }
        .game-card:nth-child(9) { animation-delay: 0.5s; }

        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
